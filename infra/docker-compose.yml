services:
  # ========== Infrastructure ==========
  kafka:
    image: apache/kafka:4.3.1
    container_name: snapgram-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: snapgram-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-auth:
    image: postgres:17
    container_name: snapgram-postgres-auth
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment: &pg-env
      POSTGRES_USER: snapgram
      POSTGRES_PASSWORD: snapgram
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapgram"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-chat:
    image: postgres:17
    container_name: snapgram-postgres-chat
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      <<: *pg-env
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapgram"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-bot:
    image: postgres:17
    container_name: snapgram-postgres-bot
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      <<: *pg-env
    volumes:
      - postgres_bot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapgram"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-content:
    image: postgres:17
    container_name: snapgram-postgres-content
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      <<: *pg-env
    volumes:
      - postgres_content_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapgram"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-recommender:
    image: postgres:17
    container_name: snapgram-postgres-recommender
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      <<: *pg-env
    volumes:
      - postgres_recommender_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapgram"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-media:
    image: postgres:17
    container_name: snapgram-postgres-media
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      <<: *pg-env
    volumes:
      - postgres_media_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapgram"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-notification:
    image: postgres:17
    container_name: snapgram-postgres-notification
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      <<: *pg-env
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapgram"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    container_name: snapgram-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: snapgram
      MINIO_ROOT_PASSWORD: snapgram-minio-dev-password
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    container_name: snapgram-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ========== Application Services ==========
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    image: snapgram/auth-service:latest
    container_name: snapgram-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/snapgram
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  chat-service:
    build:
      context: ..
      dockerfile: chat-service/Dockerfile
    image: snapgram/chat-service:latest
    container_name: snapgram-chat-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres-chat:5432/snapgram
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-chat:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  chatbot-service:
    build:
      context: ..
      dockerfile: chatbot-service/Dockerfile
    image: snapgram/chatbot-service:latest
    container_name: snapgram-chatbot-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres-bot:5432/snapgram
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-bot:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  content-service:
    build:
      context: ..
      dockerfile: content-service/Dockerfile
    image: snapgram/content-service:latest
    container_name: snapgram-content-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres-content:5432/snapgram
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres-content:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  media-service:
    build:
      context: ..
      dockerfile: media-service/Dockerfile
    image: snapgram/media-service:latest
    container_name: snapgram-media-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres-media:5432/snapgram
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres-media:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    image: snapgram/notification-service:latest
    container_name: snapgram-notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres-notification:5432/snapgram
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres-notification:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  recommender-service:
    build:
      context: ..
      dockerfile: recommender-service/Dockerfile
    image: snapgram/recommender-service:latest
    container_name: snapgram-recommender-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres-recommender:5432/snapgram
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-recommender:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    image: snapgram/api-gateway:latest
    container_name: snapgram-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

volumes:
  kafka_data:
  redis_data:
  postgres_auth_data:
  postgres_chat_data:
  postgres_bot_data:
  postgres_content_data:
  postgres_recommender_data:
  postgres_media_data:
  postgres_notification_data:
  minio_data:
