user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format hỗ trợ reverse proxy với IP client thực tế và thời gian phản hồi upstream
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # Tối ưu hóa I/O và truyền tải tệp tin
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Ẩn phiên bản Nginx trong response header để tăng cường bảo mật
    server_tokens   off;

    # Kích thước payload tối đa cho phép upload (ảnh, video, reels lên tới 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts mặc định cho reverse proxy
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Tối ưu nén Gzip cho các tài nguyên văn bản, JSON và asset tĩnh
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Nạp toàn bộ các cấu hình module hóa trong conf.d
    include /etc/nginx/conf.d/*.conf;
}
