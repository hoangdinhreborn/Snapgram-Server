# ==============================================================================
# SNAPGRAM UPSTREAM DEFINITIONS
# ==============================================================================

# API Gateway (Spring Cloud Gateway trên port nội bộ 8080)
upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

# MinIO S3 Object Storage (Port 9000)
upstream minio_s3 {
    server minio:9000;
    keepalive 16;
}

# Snapgram Web Client (Next.js port 3000 trên máy host)
upstream snapgram_client {
    server host.docker.internal:3000;
    keepalive 16;
}

# Snapgram Admin Portal (Next.js port 3001 trên máy host)
upstream snapgram_admin {
    server host.docker.internal:3001;
    keepalive 16;
}

# ==============================================================================
# HTTP SERVER (Port 80) -> Chuyển hướng HTTPS & Phục vụ Let's Encrypt Challenge
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name hqdev.ddns.net localhost 127.0.0.1;

    # Nơi Certbot lưu trữ challenge HTTP-01 để chứng minh quyền sở hữu domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health check endpoint nội bộ cho Docker Container Healthcheck
    location = /health {
        proxy_pass http://api_gateway/actuator/health;
        include    /etc/nginx/proxy_params;
    }

    # Mọi request HTTP khác tự động chuyển hướng sang HTTPS 301 (Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS SERVER (Port 443) -> SSL Termination & Reverse Proxy
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hqdev.ddns.net localhost 127.0.0.1;

    # Đường dẫn chứng chỉ SSL Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/hqdev.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hqdev.ddns.net/privkey.pem;
    include             /etc/nginx/ssl_params;

    # Nơi Certbot lưu trữ challenge HTTP-01 khi Let's Encrypt theo dõi chuyển hướng HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 1. API Endpoints (chuyển tiếp nguyên vẹn tới Spring Cloud Gateway)
    location /api/ {
        proxy_pass http://api_gateway;
        include    /etc/nginx/proxy_params;
    }

    # 2. WebSocket Realtime Streams (/ws/chat/**, /ws/notifications/**)
    location /ws/ {
        proxy_pass         http://api_gateway;
        include            /etc/nginx/proxy_params;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. MinIO S3 Object Storage (truy xuất avatar, ảnh bài viết, reels)
    # Rewrite: /storage/snapgram-media/xyz.jpg -> /snapgram-media/xyz.jpg trên MinIO
    location /storage/ {
        rewrite            ^/storage/(.*) /$1 break;
        proxy_pass         http://minio_s3;
        include            /etc/nginx/proxy_params;
        client_max_body_size 50M;
    }

    # 4. Kiểm tra sức khỏe Nginx & Gateway
    location = /health {
        proxy_pass http://api_gateway/actuator/health;
        include    /etc/nginx/proxy_params;
    }

    # 5. Snapgram Admin Portal
    location /admin {
        proxy_pass http://snapgram_admin;
        include    /etc/nginx/proxy_params;
    }

    # 6. Snapgram Web App Client (Next.js Root)
    location / {
        proxy_pass http://snapgram_client;
        include    /etc/nginx/proxy_params;
    }
}
