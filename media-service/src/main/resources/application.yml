server:
  port: 8085

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MINIO_BUCKET:snapgram-media}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/snapgram-media}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:https://ollama.com}
      model: ${OLLAMA_MODEL:gemma4:31b}
      api-key: ${OLLAMA_API_KEY:}
      timeout-seconds: 30
      temperature: 0.7

spring:
  application:
    name: media-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/snapgram}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
