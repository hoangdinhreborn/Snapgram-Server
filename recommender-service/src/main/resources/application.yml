server:
  port: 8090

spring:
  application:
    name: recommender-service
  main:
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/snapgram}
    username: ${DB_USER:snapgram}
    password: ${DB_PASSWORD:snapgram}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

recommender:
  batch:
    chunk-size: ${RECOMMENDER_BATCH_CHUNK_SIZE:20}
    trending-cron: ${RECOMMENDER_TRENDING_CRON:0 0 */2 * * *}
    user-rec-cron: ${RECOMMENDER_USER_REC_CRON:0 0 3 * * *}
    scheduled-enabled: ${RECOMMENDER_BATCH_SCHEDULED_ENABLED:false}
    demo:
      enabled: ${DEMO_BATCH_ENABLED:true}
