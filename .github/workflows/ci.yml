name: Snapgram CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  maven-build:
    name: Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show versions
        run: |
          java -version
          mvn -version

      - name: Maven Verify
        run: mvn -B -ntp verify

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create .env for compose validation
        run: cp .env.example .env

      - name: Validate compose
        run: docker compose -f infra/docker-compose.yml config -q
