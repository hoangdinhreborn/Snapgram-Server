server:
  port: 8087

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/snapgram}
    username: ${DB_USER:snapgram}
    password: ${DB_PASSWORD:snapgram}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

vnpay:
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
  ipn-url: ${VNPAY_IPN_URL:}
  version: ${VNPAY_VERSION:2.1.0}
  command: ${VNPAY_COMMAND:pay}
  order-type: ${VNPAY_ORDER_TYPE:other}
  currency: ${VNPAY_CURRENCY:VND}
  locale: ${VNPAY_LOCALE:vn}

payment:
  kafka:
    topic-completed: ${PAYMENT_TOPIC_COMPLETED:payment.completed}
  pending-timeout-minutes: ${PAYMENT_PENDING_TIMEOUT_MINUTES:15}
  frontend-result-url: ${PAYMENT_FRONTEND_RESULT_URL:http://localhost:3000/payment/result}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.payment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
