server:
  port: 8080

spring:
  application:
    name: api-gateway

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/users/**

            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content/**,/api/posts/**,/api/stories/**,/api/saved/**,/api/reports/**,/api/hashtags/**,/api/follows/**,/api/social/**,/api/admin/reports/**,/api/admin/content/**,/api/admin/posts/**

            - id: chat-service
              uri: lb://chat-service
              predicates:
                - Path=/api/conv/**

            # WebSocket: dùng ws:// scheme, cùng port với HTTP (8083)
            # Path /ws/chat/** để không conflict với /ws/notifications/**
            - id: chat-websocket
              uri: ${CHAT_WS_URL:ws://localhost:8083}
              predicates:
                - Path=/ws/chat/**

            - id: chatbot-service
              uri: lb://chatbot-service
              predicates:
                - Path=/api/bot/**

            - id: recommender-service
              uri: lb://recommender-service
              predicates:
                - Path=/api/feed/**

            - id: media-service
              uri: lb://media-service
              predicates:
                - Path=/api/media/**,/api/admin/media/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

            # WebSocket: dùng ws:// scheme, cùng port với HTTP (8086)
            - id: notification-websocket
              uri: ${NOTIFICATION_WS_URL:ws://localhost:8086}
              predicates:
                - Path=/ws/notifications/**

          metrics:
            enabled: true

    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            content-service:
              - uri: ${CONTENT_SERVICE_URL:http://localhost:8084}
            chat-service:
              - uri: ${CHAT_SERVICE_URL:http://localhost:8083}
            chatbot-service:
              - uri: ${CHATBOT_SERVICE_URL:http://localhost:8082}
            recommender-service:
              - uri: ${RECOMMENDER_SERVICE_URL:http://localhost:8090}
            media-service:
              - uri: ${MEDIA_SERVICE_URL:http://localhost:8085}
            notification-service:
              - uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
      - https://snapgram.local
  rate-limit:
    capacity: 100
    refill-duration-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
